[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hefesto"
version = "0.1.0"
description = "Plataforma de engenharia e simulação do foguete Hefesto (IREC)"
requires-python = ">=3.11"
dependencies = [
    "openmotor",
    "numpy",
    "matplotlib",
    "rocketpy>=1.13.0",
    "pydantic>=2.9",
    "nicegui>=2.0",
    "plotly>=5.24",
    "pyyaml>=6.0.3",
    "netcdf4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hefesto", "frontend"]

[tool.uv]
package = true

# openMotor (motorlib/uilib) vem direto do GitHub, fixado num commit, para o
# projeto ser reproduzível em qualquer máquina.
[tool.uv.sources]
openmotor = { git = "https://github.com/reilleya/openMotor.git", rev = "dcc7fd62045d55036451b833f60e16a786f4685d" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.3",
    "pyrefly",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
norecursedirs = [".venv", ".git", "data"]
filterwarnings = ["ignore::RuntimeWarning"]
markers = ["slow: simulações completas de balística interna"]
